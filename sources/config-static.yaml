# Static build (make build): Regular / Medium / Bold / ExtraBold from the UFO masters in sources/ufo, as released in fonts/ttf + fonts/otf.
# The UFOs are written by the rule-based generators in sources/dinhtuong/ (`make generate`).
sources:
  - ufo/DinhTuong-Regular.ufo
  - ufo/DinhTuong-Medium.ufo
  - ufo/DinhTuong-Bold.ufo
  - ufo/DinhTuong-ExtraBold.ufo
familyName: "Dinh Tuong"
buildVariable: false
buildStatic: true
buildOTF: true
buildTTF: true
buildWebfont: false
autohintTTF: false
checkCompatibility: false
outputDir: "../fonts"
# X1 (1.009): TrueType curves within 0.4 u of the cubic outlines (fontmake default 1 u); with four masters the
# variable font's shared quadratic segments otherwise drifted 0.6-0.8 % on small glyphs (¹ ~ ˛)
extraFontmakeArgs: "-e 0.0004"
