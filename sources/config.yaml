# Google Fonts build (gftools builder): the variable font DinhTuong[wght].ttf, wght 400-800.
# Sources: sources/vf, the three UFO masters made point-compatible (scripts/make_vf_sources.py: exact splits, the
# outlines are those of sources/ufo) and their designspace. At 400 / 500 / 700 / 800 the variable font draws exactly like the
# static Regular / Medium / Bold / ExtraBold (scripts/vf_vs_static.py); the static fonts are built by sources/config-static.yaml.
sources:
  - vf/DinhTuong.designspace
familyName: "Dinh Tuong"
axisOrder:
  - wght
buildVariable: true
buildStatic: false
buildWebfont: false
autohintTTF: false
outputDir: "../fonts"
# X1 (1.009): TrueType curves within 0.4 u of the cubic outlines, as the static build (sources/config-static.yaml)
extraFontmakeArgs: "-e 0.0004"
